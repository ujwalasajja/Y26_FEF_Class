<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
            vertical-align: middle;
        }

        caption {
            font-size: 25px;
            font-weight: bold;
            padding: 10px;
        }

        img {
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

<a href="https://newerp.kluniversity.in/">
    <img src="logo.png" alt="KL Logo" width="200" height="100">
</a>

<h1>Koneru Lakshmaiah Education Foundation </h1>
<style>
h1 {
    text-align: center;
    color: rgb(192, 66, 66);
}
</style>
<table>

    <caption>TIME TABLE</caption>

    <colgroup>
        <col style="background-color:rgb(204, 226, 233)">
        <col style="background-color:rgb(225, 232, 193)">
        <col style="background-color:rgb(225, 232, 193)">
        <col style="background-color:rgb(240, 205, 210)">
        <col style="background-color:rgb(181, 214, 235)">
        <col style="background-color:rgb(181, 214, 235)">
        <col style="background-color:rgb(240, 205, 210)">
        <col style="background-color:lightyellow">
        <col style="background-color:lightyellow">
    </colgroup>

    <thead>
        <tr>
            <th>Day</th>
            <th>1</th>
            <th>2</th>
            <th>Break</th>
            <th>3</th>
            <th>4</th>
            <th>Break</th>
            <th>5</th>
            <th>6</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td>Monday</td>
            <td colspan="2" rowspan="3">MATHS</td>
            <td rowspan="6" >Break</td>
            <td colspan="2" rowspan="2">DSA</td>
            <td rowspan="6">Break</td>
            <td>FIOS</td>
            <td>FSFEFW</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            
            <td colspan="2">FIOS</td>
            
        </tr>

        <tr>
            <td>Wednesday</td>
          <td colspan="2" rowspan="2">FIOS</td>
          <td colspan="2" rowspan="2">FSFEFW</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td colspan="2" rowspan="2">DSA</td>
            
           
        </tr>

        <tr>
            <td>Friday</td>
           <td colspan="2" rowspan="2">FSFEFW</td>
            
            <td colspan="2">ENGLISH</td>
        </tr>

        <tr>
            <td>Saturday</td>
            <td colspan="2">FIOS</td>
             <td>ENGLISH</td>
            <td>DSA</td>
        </tr>

    </tbody>
</table>

</body>
</html>
